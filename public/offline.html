<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZiCash | Offline</title>
    <style>
        body { font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #FBFBFE; color: #1e293b; text-align: center; padding: 20px; }
        .card { background: white; padding: 40px; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); max-width: 400px; }
        h1 { color: #2563eb; margin: 0 0 10px; font-size: 24px; }
        p { color: #64748b; line-height: 1.6; }
        button { background: #2563eb; color: white; border: none; padding: 12px 30px; border-radius: 12px; font-weight: bold; margin-top: 20px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h1>You're Offline</h1>
        <p>It looks like your connection has been interrupted. Please check your internet and try again.</p>
        <button onclick="window.location.reload()">Retry Connection</button>
    </div>
</body>
</html>
